name: PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spf001a_test
          POSTGRES_USER: spf001a
          POSTGRES_PASSWORD: spf001a_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spf001a -d spf001a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://spf001a:spf001a_test@127.0.0.1:5432/spf001a_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: npm test
