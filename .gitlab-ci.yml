stages:
  - test

postgresql-integration:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: spf001a_test
    POSTGRES_USER: spf001a
    POSTGRES_PASSWORD: spf001a_test
    TEST_DATABASE_URL: postgresql://spf001a:spf001a_test@postgres:5432/spf001a_test
  before_script:
    - pip install --no-cache-dir -r requirements.txt
    - python scripts/wait_for_postgres.py
  script:
    - python -m unittest tests.test_postgres_store -v
