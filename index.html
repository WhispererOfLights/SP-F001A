<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SP-F001A7 - Suivi production</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; font-family: system-ui, sans-serif; }
      button, input, select, textarea { font: inherit; }
      :root { --instance-banner-height: 0px; }
      body.instance-banner-active {
        --instance-banner-height: 44px;
        padding-top: var(--instance-banner-height);
      }
      #instance-banner {
        position: fixed;
        z-index: 20000;
        top: 0;
        right: 0;
        left: 0;
        height: var(--instance-banner-height);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 7px 16px;
        border-bottom: 3px solid #fff;
        color: #fff;
        box-shadow: 0 3px 12px #0007;
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
      }
      body.test-instance #instance-banner { background: #b42318; }
      body.production-instance #instance-banner { background: #1457a6; }
      #instance-banner strong { font-size: 20px; }
      #instance-banner span { font-size: 12px; }
      @media print {
        body { background: #fff !important; }
        body.instance-banner-active { --instance-banner-height: 0px; padding-top: 0; }
        #instance-banner { display: none !important; }
        .sticky-tabs, .sticky-of-header { position: static !important; top: auto !important; }
        button { display: none !important; }
        input, select, textarea { border-color: #777 !important; color: #111 !important; background: #fff !important; }
        * { color-adjust: exact; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./app-config.js"></script>
    <script>
      (() => {
        const configuredMode = String(window.SP_F001A_INSTANCE_MODE || "").toLowerCase();
        const isTest = configuredMode === "test" || window.location.port === "5182";
        const isProduction = configuredMode === "production" || window.location.port === "5181";
        if (!isTest && !isProduction) return;
        document.body.classList.add("instance-banner-active", isTest ? "test-instance" : "production-instance");
        if (isTest) document.title = "BASE TEST - SP-F001A7";
        const banner = document.createElement("div");
        banner.id = "instance-banner";
        banner.setAttribute("role", "status");
        const title = document.createElement("strong");
        title.textContent = window.SP_F001A_INSTANCE_LABEL || (isTest ? "BASE TEST" : "BASE PRODUCTION");
        const detail = document.createElement("span");
        detail.textContent = isTest
          ? "Donn\u00e9es de test copi\u00e9es \u00b7 aucun impact sur la production"
          : "Donn\u00e9es r\u00e9elles de production";
        banner.append(title, detail);
        document.body.appendChild(banner);
      })();
    </script>
    <script src="./src/clients.js?v=355"></script>
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./src/App.runtime.js?v=355"></script>
  </body>
</html>
